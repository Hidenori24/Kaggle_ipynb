name: rsna-knee Kaggle run

# Push a notebook to Kaggle and run it there. Manual only (Run workflow): Kaggle allows 2 concurrent GPU sessions and
# ~30 GPU hours a week, and every push to main used to start a 1-hour training run. Needs KAGGLE_USERNAME / KAGGLE_KEY secrets
# (same as the pokemon workflows). Does NOT submit to the competition.
on:
  workflow_dispatch:
    inputs:
      notebook:
        description: notebook file under notebooks/ (04_finetune.ipynb = train on GPU; 05_label_diag.ipynb = CPU label diagnostics, ~1 min; 06_llm_labels.ipynb = LLM label check on GPU)
        default: 04_finetune.ipynb

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install kaggle
      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
      - name: Push and run on Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: bash rsna-knee-abnormality-detection/tools/kaggle_run.sh "${{ inputs.notebook || '04_finetune.ipynb' }}"
      # Publish the trained weights/models as a private Kaggle Dataset for the offline submit notebook.
      # (No upload-artifact: this repo is public and the outputs derive from competition data.)
      - name: Publish model dataset
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          if [ -d rsna-knee-abnormality-detection/out/model_out ]; then
            python rsna-knee-abnormality-detection/tools/kaggle_dataset.py rsna-knee-model \
              rsna-knee-abnormality-detection/out/model_out "${GITHUB_SHA::7}" --only 'resnet18_imagenet.pth,models.joblib,ft_model*.pt'
          else echo "no model_out in kernel output (not the CNN notebook?)"; fi
      - name: Publish LLM label dataset
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          if [ -f rsna-knee-abnormality-detection/out/labels_out/llm_labels.csv ]; then
            python rsna-knee-abnormality-detection/tools/kaggle_dataset.py rsna-knee-labels \
              rsna-knee-abnormality-detection/out/labels_out "${GITHUB_SHA::7}" --only 'llm_labels.csv'
          else echo "no labels_out in kernel output (not the 06 notebook, or RUN_ALL is off)"; fi
